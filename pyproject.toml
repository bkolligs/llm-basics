[project]
name = "llm-basics"
version = "0.1.0"
description = "Feynman-style marimo exercises for the LLM stack"
requires-python = ">=3.12,<3.14"
dependencies = [
  "marimo>=0.19,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "torch>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

